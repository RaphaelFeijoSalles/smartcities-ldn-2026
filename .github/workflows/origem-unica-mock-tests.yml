name: Origem Unica - static mock checks

on:
  pull_request:
    paths:
      - "tools/origem-unica/**"
      - "scripts/origem-unica/**"
      - "tests/origem-unica/**"
      - "scripts/build-decision-pages.mjs"
      - ".github/workflows/origem-unica-mock-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/origem-unica/**"
      - "scripts/origem-unica/**"
      - "tests/origem-unica/**"
      - "scripts/build-decision-pages.mjs"
      - ".github/workflows/origem-unica-mock-tests.yml"

permissions:
  contents: read

jobs:
  mock-smoke:
    name: Syntax and static-site packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check tools/origem-unica/app.js
          node --check scripts/build-decision-pages.mjs
      - name: Validate synthetic contract and negative cases
        run: |
          node --check scripts/origem-unica/contract-gate.mjs
          node --test tests/origem-unica/contract-gate.test.mjs
          node scripts/origem-unica/contract-gate.mjs --fixture tests/origem-unica/records-contract.fixture.json
      - name: Build Pages artifact
        run: node scripts/build-decision-pages.mjs
      - name: Assert mock assets included in Pages output
        run: |
          test -s .pages-site/tools/origem-unica/index.html
          test -s .pages-site/tools/origem-unica/saude.html
          test -s .pages-site/tools/origem-unica/habitacao-demo.mjs
          test -s .pages-site/tools/origem-unica/app.js
          test -s .pages-site/tools/origem-unica/styles.css
          # The frontend is now allowed to fetch from its local FastAPI backend.
          # Network provenance is checked by the API contract and human review.
          grep -q '100% DADOS FICTÍCIOS' tools/origem-unica/saude.html
          grep -q 'NÃO VERIFICADO' tools/origem-unica/index.html
          grep -q 'MOCK:' tools/origem-unica/habitacao-demo.mjs
