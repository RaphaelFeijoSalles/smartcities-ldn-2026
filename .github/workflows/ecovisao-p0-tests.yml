name: EcoVisao P0 - contract and demo API

on:
  pull_request:
    paths:
      - "prototypes/ecovisao/**"
      - ".github/workflows/ecovisao-p0-tests.yml"
  push:
    branches: [main]
    paths:
      - "prototypes/ecovisao/**"
      - ".github/workflows/ecovisao-p0-tests.yml"

permissions:
  contents: read

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "prototypes/ecovisao/api/requirements-dev.txt"
      - name: Install API test dependencies
        run: python -m pip install -r prototypes/ecovisao/api/requirements-dev.txt
      - name: Validate Python syntax
        run: python -m compileall -q prototypes/ecovisao/api
      - name: Test synthetic-only API and review workflow
        run: python -m pytest -q prototypes/ecovisao/api/test_api.py
      - name: Check browser JavaScript syntax
        run: node --check prototypes/ecovisao/web/app.js
